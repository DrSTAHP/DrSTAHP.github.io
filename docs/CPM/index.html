<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator CPM</title>
</head>
<body>
    <div class="content">
        <header>
            <h1>Oblicz swoją całkowitą dzienną przemianę materii</h1>
        </header>
        
        <main>
            <aside class="MGE">
                <img src="resource/MGE1.jpeg">
            </aside>
            
            <section class="calculator">
                <div class="calc_input">
                    <form class="calc_in_form" action="#" method="POST">
                        <label class="calc_in_label" for="calc_in_age">Wiek: <input id="calc_in_age" type="number" min="1" name="age"></label>
                        <label class="calc_in_label" for="calc_in_gender">Płeć: Mężczyzna<input id="calc_in_gender" type="radio" name="gender" value="0"> Kobieta<input type="radio" name="gender" value="1"></label>
                    </form>
                </div>
                
                <div class="calc_output">

                </div>
            </section>

            <aside class="MGE">
                <img src="resource/MGE2.png">
            </aside>
        </main>
        
        <footer>
            <h3>&copy;Damian A. bo RODO</h3>
        </footer>
    </div>
</body>
</html>
